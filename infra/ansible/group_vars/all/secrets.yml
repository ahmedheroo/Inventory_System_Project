# The Kubernetes Secret `inventory-secrets`, built from each environment's encrypted vault.yml.
# Keep the vault_* names in group_vars/<env>/vault.yml; see vault.example.yml next to it.
inventory_secrets:
  MSSQL_SA_PASSWORD: "{{ vault_mssql_sa_password }}"
  RABBITMQ_USER: "{{ vault_rabbitmq_user }}"
  RABBITMQ_PASSWORD: "{{ vault_rabbitmq_password }}"
  JWT_SIGNING_KEY: "{{ vault_jwt_signing_key }}"
  SEED_USER_PASSWORD: "{{ vault_seed_user_password }}"
  SEED_SERVICE_SECRET: "{{ vault_seed_service_secret }}"
  GRAFANA_ADMIN_PASSWORD: "{{ vault_grafana_admin_password | default(vault_seed_user_password) }}"
