- name: Look up the home directory of {{ kube_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ kube_user }}"

- name: Create .kube for {{ kube_user }}
  ansible.builtin.file:
    path: "{{ getent_passwd[kube_user][4] }}/.kube"
    state: directory
    owner: "{{ kube_user }}"
    mode: "0700"

- name: Copy the kubeconfig for {{ kube_user }}
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ getent_passwd[kube_user][4] }}/.kube/config"
    remote_src: true
    owner: "{{ kube_user }}"
    mode: "0600"
