# Single-node k3s: control plane and workloads on the same EC2, with the bundled Traefik ingress
# (port 80) and local-path storage (PVCs on the instance's disk).
- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Check whether k3s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Write k3s config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
    content: |
      write-kubeconfig-mode: "0600"
      node-name: {{ inventory_hostname }}
      kubelet-arg:
        - "eviction-hard=memory.available<150Mi"
        - "system-reserved=memory=256Mi"
  notify: Restart k3s

- name: Download the k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
  when: not k3s_binary.stat.exists

- name: Install k3s
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: not k3s_binary.stat.exists
  changed_when: true

- name: Wait for the node to be Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=60s
  register: node_ready
  retries: 10
  delay: 10
  until: node_ready.rc == 0
  changed_when: false

# The deploy role runs kubectl as an unprivileged user: the SSH user everywhere, and jenkins on dev
# (the pipeline deploys dev locally). Each gets its own copy of the admin kubeconfig.
- name: Give a kubeconfig to each deploy user
  ansible.builtin.include_tasks: kubeconfig.yml
  loop: "{{ [ansible_user] + (['jenkins'] if 'dev' in group_names else []) }}"
  loop_control:
    loop_var: kube_user
