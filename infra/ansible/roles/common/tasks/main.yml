- name: Update apt cache and apply security/bug-fix upgrades
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Install base packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, jq, git, unattended-upgrades]
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

# 4 GB of RAM is tight for SQL Server + RabbitMQ + six services (+ Jenkins on dev): swap absorbs peaks
# instead of the kernel OOM-killing a pod.
- name: Check for swap file
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile

- name: Create swap file
  when: not swapfile.stat.exists
  block:
    - name: Allocate swap file
      ansible.builtin.command: fallocate -l {{ swap_size_mb }}M /swapfile
      changed_when: true

    - name: Restrict swap file permissions
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Format swap file
      ansible.builtin.command: mkswap /swapfile
      changed_when: true

    - name: Enable swap file
      ansible.builtin.command: swapon /swapfile
      changed_when: true

- name: Mount swap at boot
  ansible.posix.mount:
    name: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_set: true
