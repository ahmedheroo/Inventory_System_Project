# Fill in the two Elastic IPs (public) and the prod instance's private IP after creating them in the
# AWS console (see docs/deployment.md). `private_ip` is what Jenkins on the dev EC2 uses to reach prod:
# security-group-to-security-group rules only apply to traffic over private addresses.

[dev]
dev-ec2 ansible_host=DEV_ELASTIC_IP

[prod]
prod-ec2 ansible_host=PROD_ELASTIC_IP private_ip=PROD_PRIVATE_IP

[all:vars]
ansible_user=ubuntu
