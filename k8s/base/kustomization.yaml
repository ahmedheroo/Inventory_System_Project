# Base manifests for the whole InventorySystem stack. Applied through an overlay (k8s/overlays/<env>),
# never directly: the overlay sets the environment, and the release the Ansible `deploy` role generates
# on top of it pins the image tag.
#
# Expected in the namespace before this is applied (created by Ansible from the vault):
#   Secret `inventory-secrets` with MSSQL_SA_PASSWORD, RABBITMQ_USER, RABBITMQ_PASSWORD, JWT_SIGNING_KEY,
#   SEED_USER_PASSWORD, SEED_SERVICE_SECRET.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inventory
labels:
  - pairs:
      app.kubernetes.io/part-of: inventory-system
resources:
  - namespace.yaml
  - config.yaml
  - sqlserver.yaml
  - rabbitmq.yaml
  - product-api.yaml
  - identity-api.yaml
  - inventory-api.yaml
  - alert-api.yaml
  - reporting-api.yaml
  - console.yaml
  - monitoring.yaml
  - ingress.yaml

configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/inventory-overview.json
    options:
      disableNameSuffixHash: true
