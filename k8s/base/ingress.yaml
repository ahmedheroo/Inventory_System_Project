# Only the console and Grafana are published, through the Traefik ingress controller k3s ships with
# (port 80 on the node). The five APIs and Prometheus stay ClusterIP inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  annotations:
    # Keep SignalR WebSocket (/hubs/live) and Grafana live connections open without 60s idle drops.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: console
                port:
                  number: 8080
