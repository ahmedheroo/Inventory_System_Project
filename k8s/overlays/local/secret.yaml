# Local development secrets ONLY (for Docker Desktop / minikube / kind).
# Never used in dev/prod EC2 deployments (where Ansible injects encrypted vault secrets via stdin).
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secrets
  namespace: inventory
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: "InventoryDB@123"
  RABBITMQ_USER: "inventory"
  RABBITMQ_PASSWORD: "inventory"
  JWT_SIGNING_KEY: "inventory-development-signing-key-32-bytes-long"
  SEED_USER_PASSWORD: "inventory-console-2026"
  SEED_SERVICE_SECRET: "console-relay-development-secret"
  GRAFANA_ADMIN_PASSWORD: "inventory-grafana-2026"
