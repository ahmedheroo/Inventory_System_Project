# Production environment (prod EC2). Production seeds no sample data and refuses the published JWT key,
# so the vault for prod must hold a real 32+ character JWT_SIGNING_KEY and its own seed secrets.
# The image tag is pinned by the release kustomization the Ansible `deploy` role generates.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: prod
patches:
  - target:
      kind: ConfigMap
      name: inventory-config
    patch: |-
      - op: replace
        path: /data/ASPNETCORE_ENVIRONMENT
        value: Production
